# Listening ports
listening-port=3478
tls-listening-port=5349

# Listening IP (listen on all interfaces)
listening-ip=0.0.0.0

# External IP (Railway sẽ tự động detect từ network interface)
# coturn sẽ tự động detect external IP nếu không set
# Hoặc Railway có thể set qua environment variable

# Realm
realm=railway.turn
server-name=railway.turn

# No authentication (cho đơn giản - có thể thêm auth sau)
no-auth

# Logging
log-file=stdout
verbose

# Enable TURN (not just STUN)
# Remove stun-only to allow TURN relay functionality
no-cli

# Disable TLS/DTLS (cho đơn giản)
no-tls
no-dtls

# Allow all IPs
denied-peer-ip=
allowed-peer-ip=0.0.0.0-255.255.255.255

# User quota (unlimited)
user-quota=0
total-quota=0

# Max bps (unlimited)
max-bps=0

